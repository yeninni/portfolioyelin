 {id:'opic',title:'OPIc IM2',type:'cert',tag:'자격 / 어학',summary:'영어 말하기 시험',date:'2026.09',tags:['어학'],description:'OPIc IM2 등급을 취득했습니다.',tasks:['영어 의사소통 역량'],icon:'notes'}
 ],

};
let current='projects',subtype='all',selected=null,page=0;
const byId=id=>document.getElementById(id);
const icon=name=>ROOT+name+(name==='github'?'.svg':'.png');
const esc=s=>String(s||'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
function selectSection(id){if(!sections.some(s=>s.id===id))return;current=id;subtype='all';selected=null;page=0;render()}
function selectFilter(id){subtype=id;selected=null;page=0;renderBody()}
function chooseItem(id){selected=id;renderBody();if(window.innerWidth<=720)byId('detail').scrollIntoView({behavior:'smooth',block:'nearest'})}
function stepPage(step){const items=listItems();const pages=Math.max(1,Math.ceil(items.length/3));page=Math.max(0,Math.min(pages-1,page+step));selected=items[page*3]?.id||null;renderBody()}
function listItems(){const items=records[current]||[];return subtype==='all'?items:items.filter(i=>i.type===subtype)}
function render(){
 const s=sections.find(v=>v.id===current);byId('main-tabs').innerHTML=sections.map(t=>`<button id="tab-${t.id}" role="tab" class="tab" aria-selected="${current===t.id}" tabindex="${current===t.id?0:-1}" aria-controls="panel" onclick="selectSection('${t.id}');document.getElementById('tab-${t.id}').focus()"><img class="pixel-icon" src="${icon(t.icon)}" alt=""><span class="tab-text"><b>${t.ko}</b><small>${t.en}</small></span></button>`).join('');
 byId('panel').setAttribute('aria-labelledby','tab-'+current);byId('section-icon').src=icon(s.icon);byId('section-title').textContent=s.en;byId('intro').textContent=s.intro;
 document.querySelectorAll('.topnav button').forEach(b=>b.setAttribute('aria-current',b.dataset.go===current?'page':'false'));
 renderBody();
}
function renderBody(){
 const section=sections.find(v=>v.id===current), items=listItems();
 const maxPage=Math.max(0,Math.ceil(items.length/3)-1);page=Math.min(page,maxPage);
 if(!items.some(i=>i.id===selected))selected=items[page*3]?.id||null;
 let cur=items.find(x=>x.id===selected)||items[0];
 byId('filters').innerHTML=section.filters.map(f=>`<button class="filter ${f[0]===subtype?'selected':''}" aria-pressed="${f[0]===subtype}" data-filter="${f[0]}" onclick="selectFilter('${f[0]}');document.querySelector('[data-filter=${f[0]}]').focus()"><img class="pixel-icon" src="${icon(f[2])}" alt=""><span>${esc(f[1])}</span></button>`).join('');
 byId('counter').textContent=items.length?`${page+1} / ${maxPage+1}`:'';
 byId('prev').disabled=page===0;byId('next').disabled=page===maxPage;
 if(!items.length){byId('cards').innerHTML='<p class="empty">이 분류에는 아직 등록된 기록이 없습니다.</p>';byId('detail').style.display='none';return}
 byId('detail').style.display='grid';
 byId('cards').innerHTML=items.slice(page*3,page*3+3).map(item=>`<button class="entry ${item.id===selected?'active':''}" aria-pressed="${item.id===selected}" data-item="${item.id}" onclick="chooseItem('${item.id}');document.querySelector('[data-item=${item.id}]').focus({preventScroll:true})"><div class="cover">${item.image?`<img src="${ROOT+item.image}" alt="시안용 예시 이미지">`:`<div class="cover-graphic" data-tone="${item.type==='data'?'blue':item.type==='award'?'cream':'pink'}"><img src="${icon(item.icon||'folder')}" alt=""></div>`}<span class="type-label">${esc(item.tag)}</span></div><h3>${esc(item.title)}</h3><p>${esc(item.summary)}</p></button>`).join('');
 if(!cur)return;
 const cover=cur.detailImage||cur.image;
 byId('detail').innerHTML=`<div class="detail-visual"><div class="detail-image">${cover?`<img class="preview" src="${ROOT+cover}" alt="포트폴리오 디자인 시안 속 예시 이미지">`:`<img class="icon" src="${icon(cur.icon||'folder')}" alt="">`}</div>${cover?'<p class="mockup-note">시안용 예시 이미지 · 실제 프로젝트 화면 아님</p>':''}</div><article><div class="detail-top"><h2>${esc(cur.title)}</h2><div class="detail-meta">${esc(cur.date||'')}<br>${esc(cur.affiliation||'')}</div></div><div class="tags">${(cur.tags||[]).map(t=>`<span>${esc(t)}</span>`).join('')}</div><p class="summary">${esc(current==='projects'?cur.description.split('. ')[0]+(cur.description.includes('. ')?'.':''):cur.description)}</p><ul class="details-list">${(cur.tasks||[]).map(t=>`<li>${esc(t)}</li>`).join('')}</ul><div class="actions"><a href="${esc(cur.url||'https://github.com/yeninni/portfolioyelin')}" target="_blank" rel="noopener noreferrer"><img class="small-icon" src="${icon('github')}" alt="">${cur.url?'GitHub 방문':'코드 보기'}</a><button onclick="copyDetails()"><img class="small-icon" src="${icon('paper')}" alt="">설명 복사</button>${current==='projects'?`<button aria-expanded="false" aria-controls="project-evidence" onclick="toggleEvidence(this)"><img class="small-icon" src="${icon('paper')}" alt="">프로젝트 상세 보기</button>`:''}</div>${current==='projects'?`<div id="project-evidence" hidden>${projectDetails(cur)}</div>`:''}</article>`;
}
function toggleEvidence(button){const panel=byId('project-evidence');panel.hidden=!panel.hidden;button.setAttribute('aria-expanded',String(!panel.hidden))}
async function copyDetails(){const item=listItems().find(i=>i.id===selected);if(!item)return;let txt=[item.title,item.description,...(item.tasks||[]).map(t=>'- '+t)].join('\n');try{await navigator.clipboard.writeText(txt);alert('프로젝트 설명을 복사했어요!')}catch{alert('이 환경에서는 복사가 지원되지 않아요.')}}

const projectEvidence={
 rag:{role:'자료 인덱싱·문맥 추출 설계, 실행 환경 구성, 다국어 QA',process:'질문을 재현하고 검색 근거를 확인해 검색 오류와 답변 생성 오류를 분리했습니다.',result:'한국어·일본어 QA 검증 및 교육기관 시연에 참여했습니다.'},
 route:{role:'혼잡도 예측 모델 및 경로 탐색 기능 구성',process:'XGBoost 예측 결과를 Dijkstra·BFS 기반 경로 탐색과 결합했습니다.',result:'고령자의 이동 편의를 고려한 경로 추천 시나리오를 설계하고 연구 내용을 발표했습니다.'},
 vdi:{role:'프로비저닝 장애 지점 추적 및 동작 흐름 분석',process:'80%에서 중단되는 지점을 추적하고 관련 설정과 흐름을 분석·수정했습니다.',result:'프로비저닝 100% 정상 완료를 확인했습니다.'},
 ksa:{role:'설문 데이터 정리 및 집계 자동화',process:'상이한 문항명·컬럼을 통합하고 누락·중복 검증 로직을 구성했습니다.',result:'만족도와 강사평가 집계를 자동화했습니다.'}
};
function projectDetails(item){const e=projectEvidence[item.id];return `<dl class="evidence"><div><dt>담당 역할</dt><dd>${esc(e?.role||item.tasks[0])}</dd></div><div><dt>문제 해결</dt><dd>${esc(e?.process||item.tasks.slice(1).join(' · ')||item.description)}</dd></div><div><dt>결과</dt><dd>${esc(e?.result||({lecture:'핵심 구간의 태그·요약·타임스탬프 출력',tutor:'캡스톤디자인 동상 수상',fact:'최우수상 수상',kt:'현재 기획 진행 중',paper:'학술대회 연구 발표'}[item.id])||'제공 자료에 별도 결과가 기재되지 않았습니다.')}</dd></div></dl>`}
byId('main-tabs').addEventListener('keydown',event=>{const keys=['ArrowLeft','ArrowRight','Home','End'];if(!keys.includes(event.key))return;event.preventDefault();let i=sections.findIndex(s=>s.id===current);i=event.key==='Home'?0:event.key==='End'?sections.length-1:(i+(event.key==='ArrowRight'?1:-1)+sections.length)%sections.length;selectSection(sections[i].id);byId('tab-'+current).focus()});

render();
</script>
</body></html>
